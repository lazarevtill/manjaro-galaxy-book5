# Use PipeWire for camera enumeration instead of scanning /dev/video* directly.
#
# The IPU6 exposes ~48 raw Bayer nodes and every one of them reports
# V4L2_CAP_VIDEO_CAPTURE, so a browser that enumerates V4L2 itself offers 49
# "cameras" of which 47 produce nothing. A udev rule clears ID_V4L_CAPABILITIES
# on the raw nodes, but that only helps applications that ask udev; Chromium
# opens the device nodes directly and ignores it.
#
# Through PipeWire the list is just the two real sources:
#   Integrated Camera (V4L2)  - the v4l2-relayd bridge, 1920x1088
#   Built-in Front Camera     - libcamera directly, 1920x1080
#
# Needs Chromium >= M132 (this is Brave 151). Remove this file to go back.
--enable-features=WebRtcPipeWireCamera
