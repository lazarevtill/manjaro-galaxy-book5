# containerd's root is redirected onto the @docker subvolume (see
# /etc/containerd/config.toml), so it needs the same mount guarantee Docker has.
# docker.service pulls containerd in via Wants=, so without this containerd
# could start first and create its root inside @ before the mount existed.
[Unit]
RequiresMountsFor=/var/lib/docker

[Service]
ExecStartPre=/usr/local/sbin/gb5-docker-preflight
