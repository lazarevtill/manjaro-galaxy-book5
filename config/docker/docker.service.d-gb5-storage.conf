# Docker's data lives on the @docker btrfs subvolume (see /etc/fstab). Without
# this, a 'nofail' mount that did not happen would be invisible: Docker would
# write into @ and every Timeshift snapshot would carry the image store.
[Unit]
RequiresMountsFor=/var/lib/docker

[Service]
ExecStartPre=/usr/local/sbin/gb5-docker-preflight
