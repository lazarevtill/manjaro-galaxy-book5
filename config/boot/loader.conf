# Minimal boot menu.
#
# The Linux entry is auto-discovered from the signed UKI in \EFI\Linux, and
# Windows from \EFI\Microsoft\Boot\bootmgfw.efi — systemd-boot probes both on
# this ESP, so neither needs a hand-written entry file.

default      manjaro-*.efi
timeout      5
console-mode keep
editor       no

# Drop the "Reboot Into Firmware Interface" pseudo-entry from the menu.
#
# systemd-boot appends it last, and it was winning the default selection over
# the real entries, so a hands-off boot landed in the BIOS setup screen instead
# of Manjaro. The firmware is still reachable the normal way: tap F2 at power on
# (or `systemctl reboot --firmware-setup` from a running system).
auto-firmware no
