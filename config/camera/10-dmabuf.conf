[Service]
# The shipped unit sets a DeviceAllow whitelist (video4linux, media, drm, psys).
# Once DeviceAllow is set at all, everything absent from it is denied. libcamera's
# software ISP — which does the debayering this IPU6 camera depends on — needs a
# dma-buf provider, and both candidates are outside that list. Without them it
# logs "Could not open any dma-buf provider", disables software debayering, and
# the relay emits a blank grey frame while the sensor never even starts.
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=/dev/udmabuf rw
