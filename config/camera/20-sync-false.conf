# Take the clock-sync cliff out of the output pipeline.
#
# v4l2-relayd runs two separate GStreamer pipelines and hands buffers across
# with their ORIGINAL capture timestamps, but the output pipeline's only source
# is a live appsrc with min-latency 0 — so it has no idea the input pipeline
# exists, and every millisecond spent capturing counts as lateness. v4l2sink is
# a GstVideoSink with sync=true, qos=true and max-lateness 5 ms, giving a budget
# of roughly 38 ms per frame at 30 fps.
#
# Go over it and GstBaseSink drops EVERY frame except the one per second its
# emergency clause renders anyway ("if we did not receive anything valid for
# more than a second, render it anyway so the user sees something"). One second
# rounded up to the next 33.3 ms frame is 1033 ms — the exact stall measured
# here, first with frei0r-filter-hqdn3d in the chain, and later with no filter
# at all: the plain CPU chain sits only 0-2 ms inside the budget and was caught
# falling off it in one paired run out of three (11.85 fps, p99 1033.5 ms).
# relayd's bus watch only handles ERROR and STATE_CHANGED, so the warning
# GStreamer posts about this is discarded and the failure is silent.
#
# sync=false removes the deadline entirely. Nothing paces the output pipeline
# afterwards except the live 30 fps source itself, which is the correct pacing:
# this is a relay, not a player, and dropping a frame to hit a presentation
# deadline nobody is watching is pure loss.
#
# The ExecStart below is the stock one with `sync=false` appended to v4l2sink.
# If the package updates its unit, re-derive this from the NEW ExecStart rather
# than assuming this copy is still current — `systemctl cat v4l2-relayd@`.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'DEVICE=$(grep -l -m1 -E "^${CARD_LABEL}$" /sys/devices/virtual/video4linux/*/name | cut -d/ -f6); exec /usr/bin/v4l2-relayd -i "${VIDEOSRC}" $${SPLASHSRC:+-s "${SPLASHSRC}"} -o "appsrc name=appsrc caps=video/x-raw,format=${FORMAT},width=${WIDTH},height=${HEIGHT},framerate=${FRAMERATE} ! videoconvert ! v4l2sink name=v4l2sink device=/dev/$${DEVICE} sync=false" $EXTRA_OPTS'
