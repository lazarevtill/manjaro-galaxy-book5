# Two loopback devices, not one.
#
#   "Integrated Camera"  — fed by v4l2-relayd from libcamera, so that apps
#                          opening /dev/video* directly get a usable camera
#                          instead of a raw Bayer IPU6 node.
#   "StudioEffects"      — fed by linux-studio-effects (NPU background blur and
#                          auto-framing), consumed by meeting apps.
#
# Quoting: modprobe takes ONE value per option, so multiple card labels go in a
# single comma-separated string. Writing card_label="A","B" instead leaves a
# stray quote inside each label.
#
# Numbering: the IPU6 claims ~48 nodes at probe, including /dev/video10 which
# the upstream project's setup script assumes, so StudioEffects is pinned well
# clear of that range. The relay node stays on automatic numbering and is looked
# up by card label, because forcing a low number risks losing the race with the
# IPU6.
options v4l2loopback devices=2 exclusive_caps=1,1 video_nr=-1,60 card_label="Integrated Camera,StudioEffects"
