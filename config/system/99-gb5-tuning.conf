# Samsung Galaxy Book5 Pro H — 30 GB RAM, NVMe, zram swap.

# zram is the primary swap and lives in RAM, so swapping is cheap: let the
# kernel prefer reclaiming anonymous pages over evicting the page cache.
vm.swappiness = 100
# Swap pages come from RAM, so faulting in neighbours has no seek benefit.
vm.page-cluster = 0
# Keep dentry/inode caches around longer; there is plenty of RAM for them.
vm.vfs_cache_pressure = 50

# The percentage-based defaults allow ~6 GB of dirty pages on 30 GB of RAM,
# which turns into multi-second stalls when it finally flushes. Cap in bytes
# instead; the NVMe drains these quickly.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
# Let the writeback thread wake every 15 s instead of every 5 s. Fewer timer
# wakeups means the SoC stays in a deep package C-state longer while idle.
vm.dirty_writeback_centisecs = 1500

# Start reclaiming a little earlier to avoid allocation stalls under bursts.
vm.watermark_scale_factor = 125

# Plenty of headroom for IDEs, file sync tools and container tooling.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192

# BBR + fq is a clear win on Wi-Fi 7 / high-BDP links.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Crash recovery -- added 2026-09-11 after four hard freezes (all on kernel
# 7.1.9) were traced in the journal. Two were a confirmed kernel Oops: a GP
# fault in iwlmld/mac80211 (ieee80211_free_chanctx; fault address
# 0xdead000000000122 = freed-list poison) during a Wi-Fi 7 BE201 firmware
# restart under monitor mode (aircrack-ng). The Oops fired in a kworker holding
# net locks, and with panic_on_oops=0 the thread died while the machine
# deadlocked -- it had to be hard-powered-off. The other two freezes left NO
# journal trace at all: a silent hard hang the disabled NMI watchdog could not
# catch. So: turn every such fault into an auto-recovering, logged reboot rather
# than a dead machine. The NMI watchdog's cost (one PMU counter + a timer IRQ
# per CPU) is accepted deliberately here; recoverability beats the few mW.
kernel.nmi_watchdog = 1        # re-arm the hard-lockup detector (was 0)
kernel.panic_on_oops = 1       # an Oops panics instead of leaving a lock-holding zombie
kernel.hardlockup_panic = 1    # a detected hard lockup panics
kernel.softlockup_panic = 1    # a detected soft lockup panics
kernel.panic = 20              # panic then reboot after 20 s (0 = hang forever)
