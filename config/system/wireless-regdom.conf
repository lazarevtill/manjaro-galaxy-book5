# Regulatory domain for the wireless stack.
#
# Unset, the kernel falls back to country 00, the world domain — the most
# restrictive fallback. Setting it correctly is right regardless, but be clear
# about what it does and does not buy on this card.
#
# It DOES fix the global domain: country 00 offered no 6 GHz allocation at all,
# RS offers 5925-6425 MHz at up to 320 MHz width.
#
# It does NOT by itself enable 6 GHz here. This is an Intel BE201, and its phy
# is SELF-MANAGED: the firmware owns the regulatory domain and `iw reg set` does
# not override it. The phy still reports "country RS: DFS-UNSET" listing only
# 2.4 GHz and 5170-5250 MHz, and every 6 GHz channel from 5955 MHz up is marked
# (disabled). Intel's self-managed domain resolves from ACPI regulatory methods
# and from the country IE of an associated AP, so with no 6 GHz AP in range it
# stays closed. If 6 GHz matters later, check for a 6 GHz / Wi-Fi 7 toggle in
# the Samsung BIOS before suspecting Linux.
#
# RS = Serbia, matching the configured timezone Europe/Belgrade. Change this if
# the machine moves country — the correct value is a legal question, not a
# performance one, and picking a permissive country you are not in is not the
# same as unlocking hardware.
WIRELESS_REGDOM="RS"
