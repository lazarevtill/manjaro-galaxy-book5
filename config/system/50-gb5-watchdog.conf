# GB5 platform watchdog — added 2026-09-11.
# /dev/watchdog0 is iTCO_wdt, in the PCH, independent of the CPU cores. It is the
# only mechanism that can recover a full SoC/platform hard hang (the "silent
# freeze" class: boots -5 and -1, which left no journal trace and which the
# perf/NMI hard-lockup detector cannot catch because the LAPIC/PMU themselves
# stop). systemd pings it every RuntimeWatchdogSec/2 and disarms it cleanly
# across shutdown/hibernate. Revert by deleting this file + `systemctl daemon-reexec`.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
