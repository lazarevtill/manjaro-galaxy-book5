# Pair ramoops with the reserve_mem=8M:4096:oops region on the kernel cmdline.
# mem_name avoids hardcoding a physical address, which is fragile across firmware
# and kernel changes. max_reason=2 captures Oops and Panic; ecc=1 adds a 16-byte
# ECC so a partially corrupted record is still readable.
options ramoops mem_name=oops ecc=1 max_reason=2
