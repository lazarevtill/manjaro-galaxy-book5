# Base is "disable" (2), not "enable": on AC -- the dominant case -- power save
# costs latency and jitter for a saving that does not matter while plugged in
# (measured 2026-09-12: worst-case RTT halved, jitter down 55%). Battery is
# handled by gb5-power-profile.sh, which turns power save back ON there and
# re-asserts it every run, so a reassociation cannot leave the wrong setting.
[connection]
wifi.powersave = 2
